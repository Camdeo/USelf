services:
  - type: web
    name: uself-test
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: uself-test-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:5173

databases:
  - name: uself-test-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
